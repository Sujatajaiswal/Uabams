<!DOCTYPE html>
<html>
<head>
    <title>Gateway Data</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
<main class="shell">
    <header class="page-header">
        <div>
            <p class="eyebrow">Task 3</p>
            <h1>Gateway Data</h1>
        </div>
        <a class="nav-link" href="/dashboard">Dashboard</a>
    </header>

    <section class="panel">
        <form id="gateway-form" class="form-grid">
            <label>Record Index<input name="record_index" type="number" min="0" value="757"></label>
            <label>Train No<input name="train_no" value="TRAIN001" required></label>
            <label>Route Name<input name="route_name" value="DEFAULT" required></label>
            <label>KM Marker<input name="km_marker" type="number" min="0" value="42"></label>
            <label>Meter<input name="meter" type="number" min="0" max="999.75" step="0.25" value="450.25"></label>
            <label>Vertical g<input name="vertical_g" type="number" min="-100" max="100" step="0.1" value="75" required></label>
            <label>Lateral g<input name="lateral_g" type="number" min="-100" max="100" step="0.1" value="20" required></label>
            <label>Speed kmph<input name="speed_kmph" type="number" step="0.1" value="80" required></label>
            <label>Latitude<input name="latitude" type="number" step="0.000001" value="12.97" required></label>
            <label>Longitude<input name="longitude" type="number" step="0.000001" value="77.59" required></label>
            <label>Status Code<input name="status_code" type="number" min="0" value="1"></label>
            <button type="submit">Send Gateway Data</button>
        </form>
        <p id="message" class="message"></p>
    </section>

    <section class="panel">
        <h2>Stored Gateway Data</h2>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Train</th>
                        <th>Route</th>
                        <th>KM</th>
                        <th>Meter</th>
                        <th>Vertical</th>
                        <th>Lateral</th>
                        <th>Speed</th>
                        <th>Corrected Speed</th>
                        <th>Location</th>
                    </tr>
                </thead>
                <tbody id="gateway-body"></tbody>
            </table>
        </div>
    </section>
</main>

<script>
async function loadGatewayData() {
    const response = await fetch("/api/data");
    const rows = await response.json();
    document.getElementById("gateway-body").innerHTML = rows.map(row => `
        <tr>
            <td>${row.train_no}</td>
            <td>${row.route_name || ""}</td>
            <td>${row.km_marker ?? ""}</td>
            <td>${row.meter ?? ""}</td>
            <td>${row.vertical_g}g</td>
            <td>${row.lateral_g}g</td>
            <td>${row.speed_kmph} kmph</td>
            <td>${Number(row.corrected_speed_kmph || row.speed_kmph || 0).toFixed(2)} kmph</td>
            <td>${row.latitude}, ${row.longitude}</td>
        </tr>
    `).join("");
}

document.getElementById("gateway-form").addEventListener("submit", async event => {
    event.preventDefault();
    const data = Object.fromEntries(new FormData(event.target).entries());
    ["record_index", "km_marker", "meter", "vertical_g", "lateral_g", "speed_kmph", "latitude", "longitude", "status_code"].forEach(key => data[key] = Number(data[key]));
    data.sample_distance_m = 0.25;

    const response = await fetch("/api/data", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(data)
    });
    const result = await response.json();
    document.getElementById("message").textContent = response.ok ? result.message : result.detail;
    loadGatewayData();
});

loadGatewayData();
</script>

</body>
</html>
